<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>State is information · B</title><link rel="stylesheet" href="lesson.css"><body><header class="landing-label"><h1>State is information · B</h1><p>Preview a sound and distinguish the selected sound from playback state. This is a visual control study; no audio is connected.</p></header><main class="canvas"><div class="card"><h2 class="title">Rain on a skylight</h2><p class="subtitle">Field recordings · 2:48</p><div class="space"></div><div class="track"></div><div class="row between meta"><span>0:50</span><span>2:48</span></div><div class="space"></div><div class="row"><button class="action" data-play><i data-lucide="play" class="icon " aria-hidden="true"></i><span>Play preview</span></button></div><ul class="list"><li class="item " aria-current="true"><span class="check"><i data-lucide="check" class="icon " aria-hidden="true"></i></span><span class="name">Rain on a skylight</span><span class="small muted">2:48</span></li><li class="item"><span class="check">2</span><span class="name">A distant train</span><span class="small muted">3:16</span></li></ul></div></main><script src="media/lucide.min.js"></script><script>lucide.createIcons();document.querySelectorAll('[data-play]').forEach(b=>b.addEventListener('click',()=>{const active=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!active));b.querySelector('span').textContent=active?'Play preview':'Pause preview';const icon=b.querySelector('svg');if(icon){const replacement=document.createElement('i');replacement.dataset.lucide=active?'play':'pause';replacement.className='icon';replacement.setAttribute('aria-hidden','true');icon.replaceWith(replacement);lucide.createIcons()}const badge=document.querySelector('.badge');if(badge)badge.textContent=active?'PAUSED':'PLAYING'}));let running;document.querySelector('[data-expand]')?.addEventListener('click',e=>{const b=e.currentTarget,p=document.querySelector('.details'),open=b.getAttribute('aria-expanded')!=='true',start=p.getBoundingClientRect().height;b.setAttribute('aria-expanded',String(open));running?.cancel();const end=open?p.firstElementChild.getBoundingClientRect().height:0;p.style.height=end+'px';if(document.querySelector('[data-mode]').dataset.mode==='B'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){running=p.animate([{height:start+'px'},{height:end+'px'}],{duration:260,easing:'cubic-bezier(.2,.7,.2,1)'});}});if(new URLSearchParams(location.search).has('scene'))document.body.classList.add('only-scene');</script></body></html>
