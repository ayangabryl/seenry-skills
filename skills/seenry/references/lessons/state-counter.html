<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>State is information · counter</title><link rel="stylesheet" href="lesson.css"><body><header class="landing-label"><h1>State is information · counter</h1><p>Preview a sound and distinguish the selected sound from playback state.</p></header><main class="canvas"><div class="card"><h2 class="title">Files to upload</h2><ul class="list"><li class="item"><span class="name">Cover photo.jpg</span><span class="small">Uploaded</span></li><li class="item"><span class="name">Studio visit.mp4</span><span class="small">Waiting</span></li><li class="item"><span class="name">Interview.wav</span><span class="small">Failed</span><button class="quiet">Retry</button></li></ul></div></main><script src="media/lucide.min.js"></script><script>lucide.createIcons();document.querySelectorAll('[data-play]').forEach(b=>b.addEventListener('click',()=>{const active=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!active));b.querySelector('span').textContent=active?'Play preview':'Pause preview'}));let running;document.querySelector('[data-expand]')?.addEventListener('click',e=>{const b=e.currentTarget,p=document.querySelector('.details'),open=b.getAttribute('aria-expanded')!=='true',start=p.getBoundingClientRect().height;b.setAttribute('aria-expanded',String(open));running?.cancel();const end=open?p.firstElementChild.getBoundingClientRect().height:0;p.style.height=end+'px';if(document.querySelector('[data-mode]').dataset.mode==='B'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){running=p.animate([{height:start+'px'},{height:end+'px'}],{duration:260,easing:'cubic-bezier(.2,.7,.2,1)'});}});if(new URLSearchParams(location.search).has('scene'))document.body.classList.add('only-scene');</script></body></html>
