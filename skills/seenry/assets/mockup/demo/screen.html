<style>
:root{--bg:#f7f6f3;--ink:#16171a;--muted:#6e6f75;--line:#e6e4df;--card:#fff;--accent:#2f6b4f;--f:"Inter",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}body{width:393px;height:852px;background:var(--bg);color:var(--ink);font:400 17px/1.35 var(--f);font-feature-settings:"cv11","ss01";overflow:hidden;position:relative}
.status{height:54px;display:flex;align-items:center;justify-content:space-between;padding:14px 32px 0 40px;font-weight:600;font-size:17px}
.status svg{height:12px}
.top{padding:12px 20px 0;display:flex;justify-content:space-between;align-items:center}.top small{color:var(--muted);font-size:15px}
.avatar{width:36px;height:36px;border-radius:50%;background:#d9d3c7;display:grid;place-items:center;font-size:14px;font-weight:600;color:#5b5446}
h1{padding:4px 20px 0;font-size:34px;font-weight:600;letter-spacing:-.02em}
.hero{margin:20px 20px 0;padding:20px;border-radius:24px;background:var(--card);box-shadow:0 1px 0 rgb(0 0 0/.03),0 8px 24px rgb(0 0 0/.05)}
.hero p{color:var(--muted);font-size:15px}.big{font-size:44px;font-weight:600;letter-spacing:-.03em;margin-top:4px}.big span{color:var(--muted);font-weight:500;font-size:22px}
.bar{display:flex;gap:3px;height:10px;margin:18px 0 10px}.bar i{border-radius:3px}.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.list{margin:16px 20px 0;border-radius:24px;background:var(--card);padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}.ic svg{width:18px;height:18px}
.row b{font-weight:500;flex:1}.row em{font-style:normal;color:var(--muted);font-size:15px;margin-right:6px}.row strong{font-weight:500;font-variant-numeric:tabular-nums}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgb(247 246 243/.92);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-top:10px;font-size:11px;color:var(--muted)}
.tabs div{display:grid;justify-items:center;gap:3px}.tabs svg{width:24px;height:24px}.tabs .on{color:var(--ink)}
.home{position:absolute;bottom:8px;left:50%;translate:-50% 0;width:134px;height:5px;border-radius:3px;background:var(--ink)}
</style>
