<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus ownership study</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px;font:16px/1.5 system-ui;color:#242424;background:#fff}main{max-width:560px;margin:auto}label{display:block}button,input{font:inherit}button{padding:10px 16px;border:0;border-radius:12px;background:#eee;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid #777;outline-offset:2px}dialog{padding:20px;width:min(600px,calc(100% - 24px));border:1px solid #ddd;border-radius:20px}dialog::backdrop{background:#0004}.row{display:flex;gap:8px}.search-field{display:flex;align-items:center;gap:12px;min-width:0;flex:1;padding:10px 12px;border-radius:12px;background:#f5f5f5}.search-field:focus-within{outline:2px solid #777;outline-offset:0}.search-field input{width:100%;min-width:0;padding:4px;border:0;background:none}.search-field input:focus-visible{outline:none;box-shadow:none}.close{flex:none}.standalone{display:block;margin:8px 0 20px;padding:12px;width:100%;border:1px solid #aaa;border-radius:8px}.standalone:focus{border-color:transparent;outline:2px solid #777;outline-offset:0}p{color:#666}@media(forced-colors:active){button:focus-visible,input:focus-visible,.search-field:focus-within,.standalone:focus{outline-color:Highlight}}@media(max-width:400px){body{padding:20px}.row{gap:6px}dialog{padding:12px}}
</style><main><h1>Focus belongs to the control</h1><p>Open search, type, then use Tab and Shift+Tab. The clear action has its own indicator. Escape returns to the opener.</p><label for="email">Email</label><input class="standalone" id="email" type="email" placeholder="name@example.com"><button id="open">Open search</button></main><dialog aria-label="Search"><div class="row"><label class="search-field"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg><input autofocus aria-label="Search references" placeholder="Search references"></label><button class="close" type="button">Close</button></div><p>The field owns one boundary. The input does not draw an inner rounded box.</p><button class="clear" type="button">Clear query</button></dialog><script>const dialog=document.querySelector('dialog'),input=dialog.querySelector('input');document.querySelector('#open').onclick=()=>dialog.showModal();dialog.querySelector('.close').onclick=()=>dialog.close();dialog.querySelector('.clear').onclick=()=>{input.value='';input.focus()};</script></html>
