<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal field · Seenry</title>
<style>
  :root{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#eaf4ed;background:#101b17}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 22%,#254a3c 0,#14271e 34%,#101b17 70%)}
  main{width:min(100%,620px);padding:clamp(24px,6vw,42px);border:1px solid #42715d;border-radius:24px;background:#193126;box-shadow:0 26px 90px #07100bc2}
  .eyebrow{margin:0;color:#acd1b4;font-size:11px;font-weight:750;letter-spacing:.16em;text-transform:uppercase}
  h1{margin:10px 0 0;font-size:clamp(25px,5vw,35px);line-height:1.08;letter-spacing:-.045em}p{line-height:1.5}
  .stage{display:grid;place-items:center;min-height:248px;margin:12px 0 8px;border-radius:18px;background:radial-gradient(circle at center,#2c5b42,#214431 48%,#193126 76%)}
  canvas{display:block;width:220px;height:220px;color:#b9edba}.status{margin:0;text-align:center;font-weight:650;color:#eaf4ed}
  .hint{margin:8px 0 0;text-align:center;color:#bed4c2;font-size:12px}
  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:24px}
  button{min-height:40px;border:1px solid #668c74;border-radius:9px;color:#eaf4ed;background:#284735;font:inherit;font-size:12px;font-weight:650;cursor:pointer}
  button:hover{background:#38644a}button[aria-pressed=true]{border-color:#c1ebbd;background:#c1ebbd;color:#173223}
  button:focus-visible{outline:2px dashed #e7d786;outline-offset:4px}
  @media(max-width:400px){.controls{grid-template-columns:repeat(2,1fr);gap:12px}.stage{min-height:230px;margin:22px 0 10px}canvas{width:180px;height:180px}}
</style>
<main>
  <p class="eyebrow">Interaction study / 01</p>
  <h1>Follow the signal</h1>
  <div class="stage"><canvas id="field" width="180" height="180" aria-hidden="true"></canvas></div>
  <p class="status" id="status" role="status">Ready</p>
  <p class="hint" id="hint">Choose a state to inspect the field.</p>
  <div class="controls" role="group" aria-label="Preview process states">
    <button type="button" data-state="idle" aria-pressed="true">Ready</button>
    <button type="button" data-state="working" aria-pressed="false">Working</button>
    <button type="button" data-state="success" aria-pressed="false">Success</button>
    <button type="button" data-state="error" aria-pressed="false">Error</button>
  </div>
</main>
<script type="module">
  import {createSignalField} from './signal-field.mjs';
  const field=createSignalField(document.querySelector('#field'));
  window.signalField=field;
  const labels={idle:'Ready',working:'Processing…',success:'Process complete',error:'Process could not finish'};
  const hints={idle:'Choose a state to inspect the field.',working:'Motion continues while the process is active.',success:'The field settles when the operation succeeds.',error:'The field settles with a distinct error mark.'};
  const colors={idle:'#b9edba',working:'#b9edba',success:'#b9edba',error:'#f3b29b'};
  document.querySelectorAll('[data-state]').forEach(button=>button.addEventListener('click',()=>{
    const state=button.dataset.state;
    field.update(state,{color:colors[state]});
    document.querySelector('#status').textContent=labels[state];
    document.querySelector('#hint').textContent=hints[state];
    document.querySelectorAll('[data-state]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
  }));
</script>
</html>
