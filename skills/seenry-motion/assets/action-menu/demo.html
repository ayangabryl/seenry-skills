<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seenry action menu study</title>
<link rel="stylesheet" href="./action-menu.css">
<style>
  :root { color-scheme: light; font-family: system-ui, sans-serif; background: #e9edf1; color: #172033; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; box-sizing: border-box; }
  main { box-sizing: border-box; width: min(100%, 26rem); padding: clamp(1.25rem, 5vw, 2rem); background: #fff; border-radius: 1.1rem; box-shadow: 0 22px 60px #27354417; }
  .eyebrow { margin: 0 0 1.2rem; color: #687486; font-size: .72rem; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 1.5rem; letter-spacing: -.035em; }
  p { line-height: 1.5; }
  .meta { color: #637083; font-size: .92rem; }
  .row { margin-top: 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  #actions { min-height: 2.6rem; padding: .55rem .85rem; border: 1px solid #c8d0dc; border-radius: .65rem; background: #fff; color: #172033; font: inherit; font-weight: 600; cursor: pointer; }
  #actions:hover { background: #f5f7fa; }
  #actions:focus-visible { outline: 3px solid #4678f6; outline-offset: 2px; }
  #result { min-height: 1.5em; margin-bottom: 0; color: #52637b; font-size: .9rem; }
</style>
<main>
  <p class="eyebrow">Workspace / Documents</p>
  <h1>Field notes</h1>
  <p class="meta">Edited today · 6 pages</p>
  <div class="row">
    <span>Draft</span>
    <div class="seenry-action-menu">
      <button id="actions" type="button">Actions <span aria-hidden="true">⌄</span></button>
      <div id="actions-panel" aria-label="Document actions" hidden>
        <button role="menuitem" type="button" value="rename">Rename</button>
        <button role="menuitem" type="button" value="duplicate">Duplicate</button>
        <button role="menuitem" type="button" value="share">Share</button>
      </div>
    </div>
  </div>
  <p id="result" role="status" aria-live="polite"></p>
</main>
<script type="module">
  import { createActionMenu } from './action-menu.mjs';
  window.study = createActionMenu(document.querySelector('#actions'), document.querySelector('#actions-panel'), {
    onSelect(item) { document.querySelector('#result').textContent = `${item.textContent} selected`; },
  });
</script>
</html>
