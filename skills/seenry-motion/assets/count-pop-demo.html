<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Count pop demo</title>
<link rel="stylesheet" href="./count-pop.css">
<style>
  :root { font-family:system-ui,sans-serif; color:#1b2820; background:#edf1eb; }
  body { min-height:100vh; display:grid; place-items:center; margin:0; padding:24px; }
  main { width:min(100%,360px); background:white; border:1px solid #c9d3c8; border-radius:16px; padding:28px; }
  h1 { font-size:16px; margin:0 0 24px; }
  .value { display:flex; align-items:baseline; gap:8px; margin-bottom:24px; }
  #count { font-size:72px; line-height:1; letter-spacing:-.06em; }
  small { color:#405c49; }
  button { font:inherit; padding:10px 14px; background:#1b5537; color:white; border:0; border-radius:8px; cursor:pointer; }
  button:focus-visible { outline:3px solid #b67d30; outline-offset:3px; }
</style>
<main>
  <h1>Completed batches</h1>
  <div class="value"><strong id="count">8</strong><small>total</small></div>
  <button type="button" id="add">Complete another</button>
</main>
<script type="module">
  import {createCountPop} from './count-pop.mjs';
  const controller=createCountPop(document.querySelector('#count'),{reserveDigits:2});
  let value=8;
  document.querySelector('#add').addEventListener('click',()=>controller.update(++value));
</script>
</html>
