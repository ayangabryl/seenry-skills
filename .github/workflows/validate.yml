name: Validate curated skills
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - name: Typecheck macOS text comparison helper
        if: runner.os == 'macOS'
        run: swiftc -typecheck skills/seenry/scripts/text_compare.swift
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test skills/seenry-motion/assets/lottie-toggle.test.mjs skills/seenry-motion/assets/score.test.mjs
      - run: node --test tests/transition-contracts.test.mjs
      - name: Validate motion judgment protocol without model calls
        run: node tests/motion-judgment-contract.test.cjs
      - name: Exercise Transitions3 library logic and rendered-finding regressions
        shell: bash
        run: |
          node tests/transitions-library-logic.test.cjs
          node tests/transitions-library-rendered-findings.test.cjs
          node tests/transitions-library-title-motion.test.cjs
          node tests/transitions-library-tabs.test.cjs
          node tests/transitions-library-actual-shell.test.cjs
          node tests/transitions-library-focus-escape.test.cjs
          node tests/transitions-library-palette-input.test.cjs
          node tests/transitions-library-native-ax-assertion.test.cjs
          node tests/transitions-library-reading-keys.test.cjs
          node tests/transitions-library-reflow-assertions.test.cjs
          node tests/transitions-library-snapshot-scroll.test.cjs
          node tests/transitions-library-spaced-title.test.cjs
          node tests/transitions-library-title-boundary.test.cjs
          node tests/transitions-library-control-contrast.test.cjs
          node tests/transitions-library-stream.test.cjs
          node tests/transitions-library-blur-ownership.test.cjs
      - run: node --check skills/seenry/scripts/browser_evidence.mjs
      - run: node --check examples/seenry-site/app.js
      - run: node --check examples/seenry-site/studies/held/app.js
      - run: node --check skills/seenry-motion/assets/confirmation-burst/confirmation-burst.mjs
      - name: Install the pinned browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.63.0
      - name: Install Chromium and host dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise native streaming text and Stop contracts
        timeout-minutes: 2
        run: node tests/transitions-library-stream.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs" --out "${{ runner.temp }}/seenry-stream-contract"
      - name: Preserve native streaming evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-contract-${{ matrix.os }}
          path: ${{ runner.temp }}/seenry-stream-contract
          if-no-files-found: ignore
          retention-days: 7
      - name: Exercise Transitions3 responsive gallery bounds
        run: node tests/transitions-library.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
      - name: Exercise content reflow and user text spacing
        run: node tests/transitions-library-reflow.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs" --out "${{ runner.temp }}/seenry-reflow"
      - name: Preserve content reflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-reflow-${{ matrix.os }}
          path: ${{ runner.temp }}/seenry-reflow
          if-no-files-found: ignore
          retention-days: 7
      - name: Exercise actual shared-title content boundaries
        timeout-minutes: 3
        run: node tests/transitions-library-title-boundary.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs" --widths 360,361,384,384.5,385,400,420 --press-hold-ms 160 --out "${{ runner.temp }}/seenry-title-boundary"
      - name: Preserve shared-title boundary traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: title-boundary-${{ matrix.os }}
          path: ${{ runner.temp }}/seenry-title-boundary
          if-no-files-found: ignore
          retention-days: 7
      - name: Exercise segmented text-copy spacing geometry
        timeout-minutes: 2
        run: node tests/transitions-library-segmented-ink.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs" --out "${{ runner.temp }}/seenry-segmented-ink"
      - name: Preserve segmented text-copy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segmented-ink-${{ matrix.os }}
          path: ${{ runner.temp }}/seenry-segmented-ink
          if-no-files-found: ignore
          retention-days: 7
      - name: Exercise essential control contrast
        run: node tests/transitions-library-control-contrast.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs" --out "${{ runner.temp }}/seenry-control-contrast"
      - name: Preserve essential control contrast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-contrast-${{ matrix.os }}
          path: ${{ runner.temp }}/seenry-control-contrast
          if-no-files-found: ignore
          retention-days: 7
      - name: Exercise trusted focus recovery and image Escape
        run: node tests/transitions-library-focus-escape.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs" --out "${{ runner.temp }}/seenry-focus-escape"
      - name: Preserve focus and Escape traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focus-escape-${{ matrix.os }}
          path: ${{ runner.temp }}/seenry-focus-escape
          if-no-files-found: ignore
          retention-days: 7
      - name: Exercise trusted palette input and native-modal recovery
        run: node tests/transitions-library-palette-input.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs" --out "${{ runner.temp }}/seenry-palette-input"
      - name: Preserve palette input traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palette-input-${{ matrix.os }}
          path: ${{ runner.temp }}/seenry-palette-input
          if-no-files-found: ignore
          retention-days: 7
      - name: Exercise geometry, icons and rendered evidence
        shell: bash
        run: |
          node tests/geometry-transition.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/expanding-card.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/modal-surface.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/confirmation-burst.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/ink-compare.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/directional-stage.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/selection-surface.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/pointer-tilt.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/image-reveal.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/reflective-surface.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/text-collisions.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/morph-icon.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/number-transition.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/interaction-probe.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/system-audit.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/optical-audit.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/motion-recipes.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node skills/seenry/scripts/anatomy.mjs skills/seenry/assets/examples/player-card.html --selector article --width 560 --out /tmp/anatomy/player --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node skills/seenry/scripts/audit_page.mjs skills/seenry/assets/examples/player-card.html --strict --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs" --widths 1440,390
          node skills/seenry/scripts/audit_page.mjs skills/seenry/assets/examples/pricing.html --strict --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs" --widths 1440,390
          node skills/seenry/scripts/audit_page.mjs skills/seenry/assets/examples/settings.html --strict --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs" --widths 1440,390
          node tests/palette-study.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/visual-inventory.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/scroll-evidence.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/transition-evidence.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"
          node tests/voice-presence.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs"

  card_evidence:
    name: Record Card browser evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record exact fixture and harness sources
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('.')
          files = [
              'skills/seenry/assets/components/transitions/gallery.html',
              'skills/seenry/assets/components/transitions/gallery.js',
              'skills/seenry/assets/components/transitions/seenry-transitions.css',
              'skills/seenry/assets/components/transitions/seenry-transitions.js',
              'tests/transitions-library-close-attachment.browser.mjs',
              'tests/transitions-library-label-paint.mjs',
              'tests/transitions-library-reduced-expand-reopen.browser.mjs',
          ]
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'seenry-card-evidence'
          out.mkdir(parents=True, exist_ok=True)
          record = {
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'files': {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in files},
              'scope': 'Repository Card fixtures only; assertions and native recording are not a subjective quality score',
          }
          (out / 'source.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Install the pinned browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.63.0
      - name: Install Chromium and host dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise Transitions library source contracts
        run: node --test tests/transitions-library-*.test.cjs tests/transitions-library-label-paint.test.mjs
      - name: Record normal-motion Close and interruption evidence
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: node tests/transitions-library-close-attachment.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs" --out "${{ runner.temp }}/seenry-card-evidence/close"
      - name: Record representative Card video independently
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node tests/transitions-library-close-attachment.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs" --out "${{ runner.temp }}/seenry-card-evidence/video" --video-only true --video-width 320
      - name: Record native reduced-motion opening and reopen evidence
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: node tests/transitions-library-reduced-expand-reopen.browser.mjs --playwright "${{ github.workspace }}/node_modules/playwright/index.mjs" --out "${{ runner.temp }}/seenry-card-evidence/reduced"
      - name: Preserve Card source pins, traces, screenshots and recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-evidence-ubuntu
          path: ${{ runner.temp }}/seenry-card-evidence
          if-no-files-found: error
          retention-days: 7
