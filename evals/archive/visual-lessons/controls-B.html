<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emphasis is a limited resource · B</title><link rel="stylesheet" href="lesson.css"><body><header class="landing-label"><h1>Emphasis is a limited resource · B</h1><p>Inspect a photograph, move to adjacent photographs and download the chosen file.</p></header><main class="canvas"><div class="card "><div class="row between"><h2 class="title">Morning light</h2><button class="quiet" aria-label="Close preview"><i data-lucide="x" class="icon " aria-hidden="true"></i></button></div><div class="picture"><span>Original abstract illustration for this study</span></div><div class="photo-tools row between"><div class="nav"><button class="quiet" aria-label="Previous image"><i data-lucide="chevron-left" class="icon " aria-hidden="true"></i></button><button class="quiet" aria-label="Next image"><i data-lucide="chevron-right" class="icon " aria-hidden="true"></i></button></div><button class="action"><i data-lucide="download" class="icon " aria-hidden="true"></i>Download</button></div></div></main><script src="media/lucide.min.js"></script><script>lucide.createIcons();document.querySelectorAll('[data-play]').forEach(b=>b.addEventListener('click',()=>{const active=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!active));b.querySelector('span').textContent=active?'Play preview':'Pause preview'}));let running;document.querySelector('[data-expand]')?.addEventListener('click',e=>{const b=e.currentTarget,p=document.querySelector('.details'),open=b.getAttribute('aria-expanded')!=='true',start=p.getBoundingClientRect().height;b.setAttribute('aria-expanded',String(open));running?.cancel();const end=open?p.firstElementChild.getBoundingClientRect().height:0;p.style.height=end+'px';if(document.querySelector('[data-mode]').dataset.mode==='B'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){running=p.animate([{height:start+'px'},{height:end+'px'}],{duration:260,easing:'cubic-bezier(.2,.7,.2,1)'});}});if(new URLSearchParams(location.search).has('scene'))document.body.classList.add('only-scene');</script></body></html>
