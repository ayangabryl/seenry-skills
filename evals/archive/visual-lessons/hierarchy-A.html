<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group before emphasizing · A</title><link rel="stylesheet" href="lesson.css"><body><header class="landing-label"><h1>Group before emphasizing · A</h1><p>Choose a workshop session and understand its time and availability.</p></header><main class="canvas"><div class="card bad-heavy"><p class="meta">Saturday, 19 September</p><h2 class="title">Make your first<br>risograph print.</h2><p class="subtitle">A hands-on workshop at our studio.<br>All materials included.</p><div class="space"></div><div class="row between line"><span class="meta">10:00–12:30<br>Up to 8 people</span><span>₱1,400</span></div><div class="space"></div><button class="action">Choose a session</button><p class="meta">Two sessions available this month.</p></div></main><script src="media/lucide.min.js"></script><script>lucide.createIcons();document.querySelectorAll('[data-play]').forEach(b=>b.addEventListener('click',()=>{const active=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!active));b.querySelector('span').textContent=active?'Play preview':'Pause preview'}));let running;document.querySelector('[data-expand]')?.addEventListener('click',e=>{const b=e.currentTarget,p=document.querySelector('.details'),open=b.getAttribute('aria-expanded')!=='true',start=p.getBoundingClientRect().height;b.setAttribute('aria-expanded',String(open));running?.cancel();const end=open?p.firstElementChild.getBoundingClientRect().height:0;p.style.height=end+'px';if(document.querySelector('[data-mode]').dataset.mode==='B'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){running=p.animate([{height:start+'px'},{height:end+'px'}],{duration:260,easing:'cubic-bezier(.2,.7,.2,1)'});}});if(new URLSearchParams(location.search).has('scene'))document.body.classList.add('only-scene');</script></body></html>
