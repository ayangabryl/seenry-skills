<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color has a job · A</title><link rel="stylesheet" href="lesson.css"><body><header class="landing-label"><h1>Color has a job · A</h1><p>Browse three workshops in a playful print studio and book one.</p></header><main class="canvas"><div class="color-card bad"><div class="color-head"><h2>Make something<br>with your hands.</h2><p>Small-group print workshops. Materials included.</p></div><div class="workshops"><div class="workshop"><span class="stamp">1</span><div><strong>Risograph basics</strong><div class="small">Saturday · 10:00–12:30</div></div><button class="action">Book<span class="sr"></span></button></div><div class="workshop"><span class="stamp">2</span><div><strong>Print & collage</strong><div class="small">Sunday · 10:00–12:30</div></div><button class="action">Book<span class="sr"></span></button></div><div class="workshop"><span class="stamp">3</span><div><strong>Your first zine</strong><div class="small">Saturday · 10:00–12:30</div></div><button class="action">Book<span class="sr"></span></button></div></div></div></main><script src="media/lucide.min.js"></script><script>lucide.createIcons();document.querySelectorAll('[data-play]').forEach(b=>b.addEventListener('click',()=>{const active=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!active));b.querySelector('span').textContent=active?'Play preview':'Pause preview'}));let running;document.querySelector('[data-expand]')?.addEventListener('click',e=>{const b=e.currentTarget,p=document.querySelector('.details'),open=b.getAttribute('aria-expanded')!=='true',start=p.getBoundingClientRect().height;b.setAttribute('aria-expanded',String(open));running?.cancel();const end=open?p.firstElementChild.getBoundingClientRect().height:0;p.style.height=end+'px';if(document.querySelector('[data-mode]').dataset.mode==='B'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){running=p.animate([{height:start+'px'},{height:end+'px'}],{duration:260,easing:'cubic-bezier(.2,.7,.2,1)'});}});if(new URLSearchParams(location.search).has('scene'))document.body.classList.add('only-scene');</script></body></html>
