<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space follows groups · B</title><link rel="stylesheet" href="lesson.css"><body><header class="landing-label"><h1>Space follows groups · B</h1><p>Name an export and choose its file format in a compact dialog.</p></header><main class="canvas"><div class="card dialog "><div class="row between"><h2 class="title">Export image</h2><button class="quiet" aria-label="Close"><i data-lucide="x" class="icon " aria-hidden="true"></i></button></div><p class="subtitle">Save a copy to your device.</p><div class="fields"><label class="field">File name<input value="Sunday in the studio"></label><label class="field">Format<select><option>PNG · Best for graphics</option><option>JPEG · Smaller file</option></select></label></div><div class="footer"><button class="quiet">Cancel</button><button class="action">Export</button></div></div></main><script src="media/lucide.min.js"></script><script>lucide.createIcons();document.querySelectorAll('[data-play]').forEach(b=>b.addEventListener('click',()=>{const active=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!active));b.querySelector('span').textContent=active?'Play preview':'Pause preview'}));let running;document.querySelector('[data-expand]')?.addEventListener('click',e=>{const b=e.currentTarget,p=document.querySelector('.details'),open=b.getAttribute('aria-expanded')!=='true',start=p.getBoundingClientRect().height;b.setAttribute('aria-expanded',String(open));running?.cancel();const end=open?p.firstElementChild.getBoundingClientRect().height:0;p.style.height=end+'px';if(document.querySelector('[data-mode]').dataset.mode==='B'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){running=p.animate([{height:start+'px'},{height:end+'px'}],{duration:260,easing:'cubic-bezier(.2,.7,.2,1)'});}});if(new URLSearchParams(location.search).has('scene'))document.body.classList.add('only-scene');</script></body></html>
